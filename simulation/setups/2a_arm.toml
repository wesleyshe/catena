# Anchored to a wall by ee1, it works like an arm: curls, turns on ee1's twist servo, reaches. Watch the clamp load.
sequence = "arm_reach.csv"
move_s = 2.5
hold_s = 1.0
speed = 1.0
playback = 1.0
gravity_m_s2 = 0.0
spin_deg_s = [0.0, 0.0, 0.0]
air = false
cage = false
preset = "original14"
modules = 12
slip_ring = false

[ee1]
type = "anchor"
attach = { at = [0.0, -1.0, 1.2], facing = "+y", roll_deg = 0.0 }
