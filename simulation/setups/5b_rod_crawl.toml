# On the flight: clamps on both ends crawl along a rail across the box, one clamp always holding, like an astronaut on a handrail.
sequence = "rod_crawl.csv"
move_s = 0.9
hold_s = 0.35
preset = "feetech85"

[ee1]
type = "anchor"
attach = { rod_m = 1.5, facing = "up", roll_deg = 0.0 }

[ee12]
type = "anchor"

[rod]
from = [0.0, -0.95, 0.9]
to = [0.0, 0.95, 0.9]
diameter_mm = 25.0

[flight]
box_m = [2.0, 1.3, 1.9]
strings = [1, 5, 8, 12]
roll_deg = 0.0
level_g = 0.0
release_s = 1.0
start_s = 1.5
hyper_s = 23.0
jitter = true
seed = 1
