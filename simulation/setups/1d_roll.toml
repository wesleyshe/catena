# On the flight: let go at zero g, it rolls about its own length (a pitch fold plus a twist, twice). Watch the IMU turn.
sequence = "roll_loop.csv"
move_s = 3.0
hold_s = 1.0
speed = 2.0
preset = "feetech85"

[flight]
box_m = [2.0, 1.3, 1.9]
strings = [1, 5, 8, 12]
on_net = false
roll_deg = 0.0
level_g = 0.0
release_s = 1.0
start_s = 1.5
hyper_s = 10.0
jitter = true
seed = 1
