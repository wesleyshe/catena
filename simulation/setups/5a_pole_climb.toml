# On the flight: wrapped round a pole from the box's floor to its lid (Ø61 mm, scaled to the 8.5 cm modules), held by strings through the pull-up; let go, it climbs by squeezing, no cups or clamps.
sequence = "pole_climb.csv"
move_s = 0.7
hold_s = 0.3
preset = "feetech85"

[rod]
from = [0.0, 0.0, 0.0]
to = [0.0, 0.0, 1.9]
diameter_mm = 61.0
wrap_m = 0.6

[flight]
box_m = [2.0, 1.3, 1.9]
strings = [1, 5, 8, 12]
on_net = false
roll_deg = 0.0
level_g = 0.0
release_s = 1.0
start_s = 1.5
hyper_s = 10.0
jitter = true
seed = 1
