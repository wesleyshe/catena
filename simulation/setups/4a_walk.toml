# Walks on two suction cups in zero g: one foot always holds. Each cup: 80 mm, 60 N.
sequence = "inchworm_walk.csv"
move_s = 0.9
hold_s = 0.35

[ee1]
type = "suction"
attach = { at = [0.0, 0.6, 0.0], facing = "up", roll_deg = 0.0 }
pull_N = 60.0
cup_mm = 80.0
friction = 0.8

[ee12]
type = "suction"
pull_N = 60.0
cup_mm = 80.0
friction = 0.8
