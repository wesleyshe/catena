# The 1a turn rolled so its pitch axes lie across the cabin: the plane's pitch-over turns it about the folds' own axis, so the spin it keeps adds to the turn instead of spoiling it.
sequence = "reorient_loop.csv"
move_s = 1.0
hold_s = 0.25
preset = "feetech85"

[flight]
box_m = [2.0, 1.3, 1.9]
strings = [1, 5, 8, 12]
roll_deg = 90.0
level_g = 0.0
release_s = 1.0
start_s = 1.5
hyper_s = 23.0
jitter = true
seed = 1
