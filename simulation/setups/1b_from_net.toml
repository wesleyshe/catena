# On the flight, starting from the net with no strings: it lies on the net, heavy side down (pitch axes across the cabin), through the 1.8 g pull-up, floats off as zero g begins, then turns with no push.
sequence = "reorient_loop.csv"
move_s = 1.0
hold_s = 0.25
preset = "feetech85"

[flight]
box_m = [2.0, 1.3, 1.9]
strings = []
on_net = true
roll_deg = -90.0
level_g = 0.0
release_s = 1.0
start_s = 1.5
hyper_s = 23.0
jitter = true
seed = 1
