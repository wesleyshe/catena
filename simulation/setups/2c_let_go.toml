# On the flight, clamped to the box's end wall: it swings fast and lets go mid-swing, drifting off with the momentum the wall was taking.
sequence = "arm_let_go.csv"
move_s = 0.5
hold_s = 3.5
preset = "feetech85"

[ee1]
type = "anchor"
attach = { at = [0.0, -1.0, 0.85], facing = "+y", roll_deg = 0.0 }

[flight]
box_m = [2.0, 1.3, 1.9]
strings = [1, 5, 8, 12]
on_net = false
roll_deg = 0.0
level_g = 0.0
release_s = 1.0
start_s = 1.5
hyper_s = 10.0
jitter = true
seed = 1
