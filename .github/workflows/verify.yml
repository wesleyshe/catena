# Runs simulation/verify.py on every pull request (and on main), so a change that breaks the sim, or CAD pushed
# without re-exported meshes, shows a red check before it's merged.
name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Software OpenGL for the renders section
        run: sudo apt-get update -q && sudo apt-get install -y -q libosmesa6

      - uses: astral-sh/setup-uv@v6

      - name: Set up the sim's environment
        working-directory: simulation
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: verify.py
        working-directory: simulation
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: .venv/bin/python verify.py
